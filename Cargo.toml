[workspace]
resolver = "3"
members = [
    # ── Apps ──────────────────────────────────────────────────────────────────
    "apps/rimelight-media",
    "apps/rimelight-space/apps/*",
    "apps/rimelight-space/areas/*",
    "apps/rimelight-space/backend/*",
    "apps/rimelight-space/crates/*",
    "apps/rimelight-space/xtask",
    "apps/rimelight-personal/apps/*",
    "apps/rimelight-personal/crates/core",
    "apps/rimelight-personal/crates/idantity_nav",
    "apps/rimelight-personal/crates/idantity_ui_slint",
    "apps/rimelight-personal/crates/features/*",

    # ── Packages (shared libraries) ───────────────────────────────────────────
    "packages/ui/*",
    "packages/media/*",
    "packages/rimelight_content",
    "packages/rimelight_editor",
    "packages/rimelight_platform",
    "packages/rimelight_update",
    "packages/gallery",
    "packages/ui_check",
]

# Spikes are independent workspaces and vendored third-party crates are not
# members so their generated code is not linted.
exclude = [
    "apps/rimelight-space/spikes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
publish = false
repository = "https://github.com/Rimelight-Entertainment/rimelight-native"

[workspace.dependencies]
# Slint family, pinned exactly.
slint = "=1.18.1"
slint-build = "=1.18.1"
i-slint-backend-testing = "=1.18.1"
slint-interpreter = "=1.18.1"
# Common image encoding.
image = { version = "0.25", default-features = false, features = ["png"] }
spin_on = "0.1"
# Design tokens from the web monorepo (packages/design/crate, decision D1).
# Pinned by rev; bumped deliberately.
rimelight_design = { git = "https://github.com/Rimelight-Entertainment/rimelight.git", rev = "d4420e634ee65c11f1e46666a4a1ccf3f713f653" }

# ── Shared packages (local path, formerly pulled from rimelight-rs by tag) ──
rimelight_content       = { path = "packages/rimelight_content" }
rimelight_editor        = { path = "packages/rimelight_editor" }
rimelight_media         = { path = "packages/media/rimelight_media", features = ["slint"] }
rimelight_picture       = { path = "packages/media/rimelight_picture" }
rimelight_platform      = { path = "packages/rimelight_platform" }
rimelight_shell         = { path = "packages/ui/rimelight_shell" }
rimelight_sound         = { path = "packages/media/rimelight_sound" }
rimelight_ui            = { path = "packages/ui/rimelight_ui" }
rimelight_ui_kit        = { path = "packages/ui/rimelight_ui_kit" }
rimelight_update        = { path = "packages/rimelight_update" }
rimelight_gallery       = { package = "ui_gallery", path = "packages/gallery" }

# ── Personal app crates (formerly in apps/rimelight-personal/Cargo.toml) ────
ehttp = "0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
idantity_core              = { path = "apps/rimelight-personal/crates/core" }
idantity_nav               = { path = "apps/rimelight-personal/crates/idantity_nav" }
idantity_ui_slint          = { path = "apps/rimelight-personal/crates/idantity_ui_slint" }
idantity_feature_overview  = { path = "apps/rimelight-personal/crates/features/overview" }
idantity_feature_todos     = { path = "apps/rimelight-personal/crates/features/todos" }
idantity_feature_focus     = { path = "apps/rimelight-personal/crates/features/focus" }
idantity_feature_notes     = { path = "apps/rimelight-personal/crates/features/notes" }
idantity_feature_habits    = { path = "apps/rimelight-personal/crates/features/habits" }
idantity_feature_watchlist = { path = "apps/rimelight-personal/crates/features/watchlist" }
idantity_feature_music     = { path = "apps/rimelight-personal/crates/features/music" }
idantity_feature_notebooks = { path = "apps/rimelight-personal/crates/features/notebooks" }
idantity_feature_projects  = { path = "apps/rimelight-personal/crates/features/projects" }
idantity_feature_finances  = { path = "apps/rimelight-personal/crates/features/finances" }
idantity_feature_housing   = { path = "apps/rimelight-personal/crates/features/housing" }
idantity_feature_health    = { path = "apps/rimelight-personal/crates/features/health" }
idantity_feature_inbox     = { path = "apps/rimelight-personal/crates/features/inbox" }
idantity_feature_storage   = { path = "apps/rimelight-personal/crates/features/storage" }

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# ffmpeg-sys-next bindings are checked in under vendor/ffmpeg-sys-next
# so building needs neither clang nor FFmpeg headers (decision 0046).
[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }

[profile.dev]
debug = "line-tables-only"
# Build scripts and proc macros run optimised (decision 0037).
[profile.dev.package."*"]
debug = false
[profile.dev.build-override]
opt-level = 3
# Picture decoding/encoding crates run optimised in dev builds too.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.pxfm]
opt-level = 3
