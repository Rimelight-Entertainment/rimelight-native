[package]
name = "rimelight-personal-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The same Slint app shell as apps/desktop (rimelight_personal_ui_slint). Built for the browser with `trunk build --release` from this
# folder (index.html names the bin). No eframe, no crates/app.
[dependencies]
rimelight_personal_ui_slint.workspace = true
rimelight_ui_kit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
