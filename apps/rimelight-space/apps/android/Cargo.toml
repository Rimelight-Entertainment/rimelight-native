[package]
name = "rimelight_android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Lints are spelled out, not inherited: unsafe_code is `deny` with one narrow allow on the android_main export (see
# PROJECT.md section 15.4, proposed). Keep the rest equal to [workspace.lints] in the root Cargo.toml.
[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Android entry point (P0.06). cargo-ndk builds the cdylib into android/app/src/main/jniLibs; Gradle packages it
# (see android/). The lib name must match android.app.lib_name in android/app/src/main/AndroidManifest.xml.
[lib]
name = "rimelight_android"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
# android-activity backend for Slint.
slint = { workspace = true, features = ["backend-android-activity-06"] }
space_ui = { path = "../../crates/space_ui" }
space_area_projects = { path = "../../areas/projects" }
space_client = { path = "../../crates/space_client" }
# The browser sign-in return: opens the browser and reads the activity's intent (SA.7, decision 0018).
rimelight_platform = { workspace = true }
