name: Release Rimelight Media

# Pushing a version tag such as media-v0.3.0 builds the Windows installer and update package and publishes them as a GitHub release.
# The tag version (without `media-v`) must equal `version` in apps/rimelight-media/apps/desktop/Cargo.toml.

on:
  push:
    tags:
      - "media-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-media
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer and update package (Media)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 (Node 24)
      - name: Install vpk (Velopack CLI, the version xtask packs with)
        run: dotnet tool install --global vpk --version $(cargo xtask media vpk-version)
        shell: pwsh
      - name: Fetch the previous release (for small delta updates)
        working-directory: apps/rimelight-media/apps/desktop
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir releases
        continue-on-error: true # the first release has nothing to fetch
      - name: Build and pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^media-v', ''
          cargo xtask media pack --version $version --repo "${{ github.repository }}"
      - name: Publish the GitHub release
        working-directory: apps/rimelight-media/apps/desktop
        run: >
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}" --publish
          --releaseName "Rimelight Media ${{ github.ref_name }}" --tag "${{ github.ref_name }}"
          --outputDir releases
