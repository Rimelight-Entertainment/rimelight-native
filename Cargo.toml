[workspace]
resolver = "3"
members = [
    # Apps
    "apps/rimelight-media/apps/*",
    "apps/rimelight-space/apps/*",
    "apps/rimelight-space/areas/*",
    "apps/rimelight-space/backend/*",
    "apps/rimelight-space/crates/*",
    "apps/rimelight-space/xtask",
    "apps/rimelight-personal/apps/*",
    "apps/rimelight-personal/crates/core",
    "apps/rimelight-personal/crates/rimelight_personal_nav",
    "apps/rimelight-personal/crates/rimelight_personal_ui_slint",
    "apps/rimelight-personal/crates/features/*",

    # Packages
    "packages/ui/*",
    "packages/media/*",
    "packages/rimelight_content",
    "packages/rimelight_editor",
    "packages/rimelight_platform",
    "packages/rimelight_update",
    "packages/gallery",
    "packages/ui_check",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
publish = false
repository = "https://github.com/Rimelight-Entertainment/rimelight-native"

[workspace.dependencies]
slint = "=1.18.1"
slint-build = "=1.18.1"
slint-interpreter = "=1.18.1"
i-slint-backend-testing = "=1.18.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rimelight_design = { git = "https://github.com/Rimelight-Entertainment/rimelight.git", rev = "d1231382d6a7101bd175b8c5016726c1ed557802" }
rimelight_content       = { path = "packages/rimelight_content" }
rimelight_editor        = { path = "packages/rimelight_editor" }
rimelight_media         = { path = "packages/media/rimelight_media", features = ["slint"] }
rimelight_picture       = { path = "packages/media/rimelight_picture" }
rimelight_platform      = { path = "packages/rimelight_platform" }
rimelight_shell         = { path = "packages/ui/rimelight_shell" }
rimelight_sound         = { path = "packages/media/rimelight_sound" }
rimelight_ui            = { path = "packages/ui/rimelight_ui" }
rimelight_ui_kit        = { path = "packages/ui/rimelight_ui_kit" }
rimelight_update        = { path = "packages/rimelight_update" }
rimelight_gallery       = { package = "ui_gallery", path = "packages/gallery" }
ehttp = "0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rimelight_personal_core              = { path = "apps/rimelight-personal/crates/core" }
rimelight_personal_nav               = { path = "apps/rimelight-personal/crates/rimelight_personal_nav" }
rimelight_personal_ui_slint          = { path = "apps/rimelight-personal/crates/rimelight_personal_ui_slint" }
rimelight_personal_feature_overview  = { path = "apps/rimelight-personal/crates/features/overview" }
rimelight_personal_feature_todos     = { path = "apps/rimelight-personal/crates/features/todos" }
rimelight_personal_feature_focus     = { path = "apps/rimelight-personal/crates/features/focus" }
rimelight_personal_feature_notes     = { path = "apps/rimelight-personal/crates/features/notes" }
rimelight_personal_feature_habits    = { path = "apps/rimelight-personal/crates/features/habits" }
rimelight_personal_feature_watchlist = { path = "apps/rimelight-personal/crates/features/watchlist" }
rimelight_personal_feature_music     = { path = "apps/rimelight-personal/crates/features/music" }
rimelight_personal_feature_notebooks = { path = "apps/rimelight-personal/crates/features/notebooks" }
rimelight_personal_feature_projects  = { path = "apps/rimelight-personal/crates/features/projects" }
rimelight_personal_feature_finances  = { path = "apps/rimelight-personal/crates/features/finances" }
rimelight_personal_feature_housing   = { path = "apps/rimelight-personal/crates/features/housing" }
rimelight_personal_feature_health    = { path = "apps/rimelight-personal/crates/features/health" }
rimelight_personal_feature_inbox     = { path = "apps/rimelight-personal/crates/features/inbox" }
rimelight_personal_feature_storage   = { path = "apps/rimelight-personal/crates/features/storage" }

[workspace.metadata.ffmpeg]
release = "ffmpeg-n9.0.2-r1"
asset = "rimelight-ffmpeg-n9.0.2-r1-win64-lgpl-shared.zip"
sha256 = "013136dbfe3ae75d6f2eadcd6bec35f7a2fc49d2163996f01625ef5a912d0de0"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
