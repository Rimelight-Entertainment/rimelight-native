<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rimelight Space</title>
    <link data-trunk rel="rust" data-bin="rimelight_web" data-wasm-opt="z" />
    <link data-trunk rel="icon" href="../../assets/web/favicon.png" />
    <link data-trunk rel="copy-file" href="../../assets/web/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F2F1EE; }
      /* The canvas fills the window. Slint sizes its drawing surface from the canvas box, so resizing the window
         resizes the canvas. display:block removes the inline descender strip under the canvas. */
      canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body><canvas id="canvas"></canvas></body>
</html>
