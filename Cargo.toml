[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/web",
    "crates/core",
    "crates/idantity_nav",
    "crates/idantity_ui_slint",
    "crates/features/overview",
    "crates/features/todos",
    "crates/features/focus",
    "crates/features/notes",
    "crates/features/habits",
    "crates/features/watchlist",
    "crates/features/music",
    "crates/features/notebooks",
    "crates/features/projects",
    "crates/features/finances",
    "crates/features/housing",
    "crates/features/health",
    "crates/features/inbox",
    "crates/features/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "LicenseRef-Idantity-Proprietary"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
ehttp = "0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Slint port, same pins as rimelight-space (its root Cargo.toml). Used by apps/desktop.
slint = "=1.18.1"
slint-build = "=1.18.1"
# Headless Slint tests (the testing backend, no window). Same pin as rimelight-space; used by apps/desktop's tests.
i-slint-backend-testing = "=1.18.1"
# Shared Rimelight crates (rimelight-rs, tag v0.4.0; the main session cuts that tag). Bumped deliberately.
rimelight_ui = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0" }
rimelight_ui_kit = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0" }
rimelight_shell = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0" }
rimelight_platform = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0" }
rimelight_update = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0" }
rimelight_sound = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0" }
rimelight_picture = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0" }
rimelight_media = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0", features = ["slint"] }
# Design tokens (Rust constants and the tokens.slint library, path `rimelight_design`). Same rev Space pins.
rimelight_design = { git = "https://github.com/Rimelight-Entertainment/rimelight.git", rev = "d4420e634ee65c11f1e46666a4a1ccf3f713f653" }
idantity_core = { path = "crates/core" }
idantity_nav = { path = "crates/idantity_nav" }
idantity_ui_slint = { path = "crates/idantity_ui_slint" }
# Feature crates (crates/features/README.md): plain Rust controllers, Slint markup compiled by idantity_ui_slint.
idantity_feature_overview = { path = "crates/features/overview" }
idantity_feature_todos = { path = "crates/features/todos" }
idantity_feature_focus = { path = "crates/features/focus" }
idantity_feature_notes = { path = "crates/features/notes" }
idantity_feature_habits = { path = "crates/features/habits" }
idantity_feature_watchlist = { path = "crates/features/watchlist" }
idantity_feature_music = { path = "crates/features/music" }
idantity_feature_notebooks = { path = "crates/features/notebooks" }
idantity_feature_projects = { path = "crates/features/projects" }
idantity_feature_finances = { path = "crates/features/finances" }
idantity_feature_housing = { path = "crates/features/housing" }
idantity_feature_health = { path = "crates/features/health" }
idantity_feature_inbox = { path = "crates/features/inbox" }
idantity_feature_storage = { path = "crates/features/storage" }

# rimelight_media needs the patched ffmpeg-sys-next (bindings checked in), as rimelight-space does.
[patch.crates-io]
ffmpeg-sys-next = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.4.0" }
