name: Release Rimelight Media

# Pushing a version tag such as media-v0.3.0 builds the Windows installer and update package and publishes them as a GitHub release.
# The tag version (without `media-v`) must equal `version` in apps/rimelight-media/apps/desktop/Cargo.toml.

on:
  push:
    tags:
      - "media-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-media
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer and update package (Media)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 (Node 24)
      - name: Install vpk (Velopack CLI, the version xtask packs with)
        run: dotnet tool install --global vpk --version $(cargo xtask media vpk-version)
        shell: pwsh
      - name: Build and pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^media-v', ''
          cargo xtask media pack --version $version --repo "${{ github.repository }}"
      - name: Upload to R2 (the Media update feed)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out=apps/rimelight-media/apps/desktop/releases
          dest="s3://rimelight-dot-com/media/releases/win"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync "$out" "$dest" --endpoint-url "$endpoint" --exclude "*" --include "*.nupkg"
          aws s3 sync "$out" "$dest" --endpoint-url "$endpoint" --exclude "*" --include "*-Setup.exe" --include "*-Portable.zip"
          aws s3 sync "$out" "$dest" --endpoint-url "$endpoint" --exclude "*" --include "assets.*.json" --include "RELEASES*"
          aws s3 sync "$out" "$dest" --endpoint-url "$endpoint" --exclude "*" --include "releases.*.json"
