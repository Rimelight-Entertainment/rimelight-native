[workspace]
resolver = "3"
members = ["crates/*", "areas/*", "apps/*", "backend/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
slint = "=1.18.1"
slint-build = "=1.18.1"
i-slint-backend-testing = "=1.18.1"
# Design tokens: now a local path dep via the root workspace.
rimelight_design = { git = "https://github.com/Rimelight-Entertainment/rimelight.git", rev = "d4420e634ee65c11f1e46666a4a1ccf3f713f653" }
# Shared component library — now local path deps (packages/ in the monorepo root).
rimelight_ui         = { path = "../../packages/rimelight_ui" }
rimelight_ui_kit     = { path = "../../packages/rimelight_ui_kit" }
rimelight_shell      = { path = "../../packages/rimelight_shell" }
rimelight_media      = { path = "../../packages/rimelight_media", features = ["slint"] }
rimelight_picture    = { path = "../../packages/rimelight_picture" }
rimelight_gallery    = { path = "../../packages/gallery" }
rimelight_platform   = { path = "../../packages/rimelight_platform" }
rimelight_update     = { path = "../../packages/rimelight_update" }
rimelight_content    = { path = "../../packages/rimelight_content" }
rimelight_editor     = { path = "../../packages/rimelight_editor" }

# ffmpeg-sys-next bindings are now checked in under packages/rimelight_media/vendor/.
# The root workspace Cargo.toml patches crates-io for the whole monorepo.

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "forbid"

# Profiles and picture-opt overrides live in the root workspace Cargo.toml.

