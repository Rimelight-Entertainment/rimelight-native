[package]
name = "rimelight_personal_ui_slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The only crate that compiles Slint for the Rimelight Personal app shell (crates/features/README.md). Apps (desktop, web) depend on
# it and nothing else for UI. Unsafe is denied; Slint's generated module allows it (see src/lib.rs).
[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
# unstable-winit-030: the window's winit events, for the OS file drops (src/platform.rs, native only).
slint = { workspace = true, features = ["unstable-winit-030"] }
rimelight_ui_kit.workspace = true
rimelight_platform.workspace = true
rimelight_picture.workspace = true
rimelight_media.workspace = true
rimelight_personal_nav.workspace = true
rimelight_personal_core.workspace = true
rimelight_personal_feature_overview.workspace = true
rimelight_personal_feature_todos.workspace = true
rimelight_personal_feature_focus.workspace = true
rimelight_personal_feature_habits.workspace = true
rimelight_personal_feature_notebooks.workspace = true
rimelight_personal_feature_notes.workspace = true
rimelight_personal_feature_music.workspace = true
rimelight_personal_feature_watchlist.workspace = true
rimelight_personal_feature_projects.workspace = true
rimelight_personal_feature_finances.workspace = true
rimelight_personal_feature_housing.workspace = true
rimelight_personal_feature_health.workspace = true
rimelight_personal_feature_inbox.workspace = true
rimelight_personal_feature_storage.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The clipboard (platform.rs copy_text) and opening a URL or file in the system (open_url), native only.
arboard = "3.7.0"
open = "5.4.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Opening an attachment's link in a new browser tab (src/pages/music.rs, web build only).
web-sys = { version = "0.3", features = ["Window"] }

[build-dependencies]
slint-build.workspace = true
# build.rs maps the library paths: the design tokens, the shared components and shell, and every feature page's markup.
rimelight_design.workspace = true
rimelight_ui.workspace = true
rimelight_shell.workspace = true
rimelight_personal_feature_overview.workspace = true
rimelight_personal_feature_todos.workspace = true
rimelight_personal_feature_focus.workspace = true
rimelight_personal_feature_habits.workspace = true
rimelight_personal_feature_notebooks.workspace = true
rimelight_personal_feature_notes.workspace = true
rimelight_personal_feature_music.workspace = true
rimelight_personal_feature_watchlist.workspace = true
rimelight_personal_feature_projects.workspace = true
rimelight_personal_feature_finances.workspace = true
rimelight_personal_feature_housing.workspace = true
rimelight_personal_feature_health.workspace = true
rimelight_personal_feature_inbox.workspace = true
rimelight_personal_feature_storage.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true
