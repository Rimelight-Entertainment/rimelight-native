[package]
name = "rimelight_web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The same Slint app shell as apps/desktop. Built for the browser with `trunk build --release`
# from this directory (index.html names the bin).
space_ui = { path = "../../crates/space_ui" }
slint = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
# The sign-in client for the browser (SA.6): fetch, the browser session store and the same-tab sign-in.
space_client = { path = "../../crates/space_client" }
