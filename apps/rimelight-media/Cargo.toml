[package]
name = "rimelight-media"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false
description = "Rimelight Media: pictures, video, music, screenshots and screen recording in one small app"
default-run = "rimelight-media"

# Same rule as rimelight-space: no unsafe code, except the audited modules that talk to Windows (src/capture/camera.rs; the Win32 calls are in rimelight_platform)
# and the code Slint generates (src/ui.rs). The picture subtitles and HEIF unsafe code is in rimelight-rs.
[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "deny"

[dependencies]
# The theme glue (rimelight_ui_kit). The markup libraries (tokens, components) are build-dependencies below.
# Pinned like rimelight-space: rimelight-rs crates to a tag.
rimelight_ui_kit = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.3.3" }
# Video and sound from rimelight-rs: the engine (FFmpeg and cpal) with subtitles, speed and trimming. `slint` keeps frames
# as Slint pixel buffers, so the player hands them to the window without a copy.
rimelight_media = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.3.3", features = ["slint"] }
# Pictures from rimelight-rs: decode (with RAW and HEIF), thumbnails, animation, edits, markup and saving.
rimelight_picture = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.3.3", features = ["raw", "heif"] }
# OS calls shared with Rimelight Space (screen capture, windows, the start lock, shell and print calls), behind one portable API.
rimelight_platform = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.3.3" }
# Self-update from GitHub Releases with Velopack (the installer hooks run in main.rs).
rimelight_update = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.3.3" }
# The window and every screen. Femtovg draws on the GPU; the software renderer is the fallback.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
# Pictures the app writes itself (camera stills, the app icon). Decoding and saving pictures is rimelight_picture.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
# Drawing for the capture markup and the app icon. Same version as rimelight_picture, which draws the pictures.
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# Video and sound decoding and encoding (rimelight-space decision 0046). Without FFmpeg's device and filter libraries:
# the screen is grabbed with Windows' own calls and playback speed is done in rimelight_media, so avdevice and avfilter (37 MB) don't ship.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
# Sound output, microphone and the system-sound loopback.
cpal = "0.18"
# PrintScreen and the other global keys.
global-hotkey = "0.7"
# Copy screenshots to the clipboard.
arboard = "3.7"
# Open and save dialogs.
rfd = "0.15"
# Text tab: Markdown preview (tables, task lists, strikethrough).
pulldown-cmark = { version = "0.13", default-features = false }
# Text tab: JSON format, minify, validate, sort keys and the tree view (key order kept).
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
# Text tab: syntax colours (pure-Rust fancy-regex engine, no onig C build).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Text tab: the extra syntaxes (TOML, TypeScript, PowerShell, INI, ...) and the One Half themes for syntect.
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
# Files tab: zip create (AES-256) and open, from the zip crate that is already in the build.
zip = "9.8"
# Files tab: 7z open and extract (pure Rust, Apache-2.0).
sevenz-rust2 = "0.25"
# Files tab: RAR open and extract. Bundles unrar's C++ source, so it needs a C++ compiler; RAR files can't be created.
unrar = "0.5"
# Files tab: modified dates in local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# File types, default apps and the start-up entry (all per user, no admin).
winreg = "0.56"
# Windows' Share panel and its built-in text recognition (WinRT). Already in the build through cpal; only these parts
# are added.
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[build-dependencies]
slint-build = "=1.18.1"
# build.rs passes their UI_DIR folders to the Slint compiler as the library paths rimelight_design and rimelight_ui. Pinned
# like rimelight-space: the tokens to a rimelight commit, the component library to a rimelight-rs tag.
rimelight_design = { git = "https://github.com/Rimelight-Entertainment/rimelight.git", rev = "d4420e634ee65c11f1e46666a4a1ccf3f713f653" }
rimelight_ui = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.3.3" }
# The app icon inside the exe (shortcuts, taskbar, Explorer), compiled with the Windows SDK's rc.exe.
embed-resource = "3"

# ffmpeg-sys-next with its bindings checked in, from rimelight-rs (vendor/ffmpeg-sys-next, the same copy the other Rimelight apps
# use), so building needs neither clang nor the FFmpeg headers. FFmpeg itself comes from tools/get-ffmpeg.ps1 (FFMPEG_DIR in
# .cargo/config.toml).
[patch.crates-io]
ffmpeg-sys-next = { git = "https://github.com/Rimelight-Entertainment/rimelight-rs.git", tag = "v0.3.3" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.dev.build-override]
opt-level = 3

# Fast first, then small: full optimisation, one codegen unit, whole-program optimisation, no symbols, no unwinding.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
