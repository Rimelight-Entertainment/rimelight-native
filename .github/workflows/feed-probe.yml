name: Feed probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Request the Space feed from the runner
        shell: bash
        run: |
          for u in https://rimelight.com/v1/releases/win/releases.stable.json https://rimelight.com/v1/releases/win/RimelightSpace-0.1.0-stable-full.nupkg; do
            echo "== $u"
            curl -sS -o /dev/null -D - "$u" | grep -iE "^HTTP|cf-ray|server|cf-mitigated" || true
            curl -s -o /dev/null -w "code=%{http_code}\n" "$u"
          done
