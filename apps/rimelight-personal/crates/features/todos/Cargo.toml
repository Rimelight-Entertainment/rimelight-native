[package]
name = "rimelight_personal_feature_todos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Plain Rust: no slint dependency and no build.rs. The page markup is in ui/todos.slint and is compiled by apps/desktop.
# ehttp and serde_json are used for the todo endpoints the core client does not cover (recurring fields, due dates,
# the filter-free list decode). The core stays untouched.
[lints]
workspace = true

[dependencies]
rimelight_personal_core.workspace = true
ehttp.workspace = true
serde.workspace = true
serde_json.workspace = true
