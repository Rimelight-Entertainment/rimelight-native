[package]
name = "space_page_kit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rimelight Space page kit: the page data pattern, the person and picker rules, and the macros area crates expand to wire them to the window."

[lints]
workspace = true

[dependencies]
image = { workspace = true, features = ["jpeg", "webp", "gif"] }
slint = { workspace = true }
space_client = { path = "../space_client" }
space_proto = { path = "../space_proto" }

# The web sign-in runs its client futures on the page (spawn_local).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
