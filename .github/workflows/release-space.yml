name: Release Rimelight Space

# Pushing a version tag such as space-v0.2.0 builds the Windows installer and update feed and uploads them to R2 (REL.4, decision 0047).
# The tag version (without `space-v`) must equal the version in apps/rimelight-space/apps/desktop/Cargo.toml.
#
# Secrets (repository settings > Secrets and variables > Actions), never written to the repo:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   an R2 API token with Object Read & Write on the bucket
#   RIMELIGHT_SIGN_PARAMS (optional)                          signtool.exe arguments; unset means the files are not signed

on:
  push:
    tags:
      - "space-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-space
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VPK_VERSION: "1.3.39-g8d2844f"
  R2_BUCKET: rimelight-dot-com
  R2_PREFIX: space/releases/win

jobs:
  windows:
    name: Windows installer and update feed (Space)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install vpk (Velopack CLI)
        run: dotnet tool install --global vpk --version $env:VPK_VERSION
      - name: Fetch the pinned FFmpeg build
        run: cargo run -p xtask -- ffmpeg
      - name: Build and package
        env:
          RIMELIGHT_SIGN_PARAMS: ${{ secrets.RIMELIGHT_SIGN_PARAMS }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^space-v', ''
          cargo run -p xtask -- release pack --expect-version $version
      - name: Upload to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out=target/release-out
          dest="s3://${R2_BUCKET}/${R2_PREFIX}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ls -l "$out"
          aws s3 sync "$out" "$dest" --endpoint-url "$endpoint" --exclude "*" --include "*.nupkg"
          aws s3 sync "$out" "$dest" --endpoint-url "$endpoint" --exclude "*" --include "*-Setup.exe" --include "*-Portable.zip"
          aws s3 cp "$out/min-version.stable.txt" "$dest/min-version.stable.txt" --endpoint-url "$endpoint"
          aws s3 sync "$out" "$dest" --endpoint-url "$endpoint" --exclude "*" --include "assets.*.json" --include "RELEASES-*"
          aws s3 sync "$out" "$dest" --endpoint-url "$endpoint" --exclude "*" --include "releases.*.json"
      - name: Attach the installer to a GitHub Release (download and notes only; updates come from R2)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" target/release-out/RimelightSpace-*-Setup.exe \
            --repo "$GITHUB_REPOSITORY" --title "Rimelight Space $GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" target/release-out/RimelightSpace-*-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber
