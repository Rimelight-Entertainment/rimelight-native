[registry]
global-min-publish-age = "1 day"

[env]
# Shared trimmed FFmpeg build (fetched automatically on Windows by apps/rimelight-media/build.rs
# or manually via apps/rimelight-media/tools/get-ffmpeg.ps1). An FFMPEG_DIR already set in the
# environment always wins.
FFMPEG_DIR = { value = "apps/rimelight-media/ffmpeg/current", relative = true, force = false }

[alias]
xtask = "run --package xtask --"

# getrandom 0.3 on wasm32-unknown-unknown needs its JS backend selected by this cfg.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# Link with the LLVM linker shipped in the toolchain: much faster than MSVC link.exe for Slint apps.
# Static CRT (+crt-static) avoids requiring the Visual C++ Redistributable on Windows.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-C", "target-feature=+crt-static"]
