[package]
name = "ffmpeg-sys-next"
version = "9.1.1"
edition = "2024"
links = "ffmpeg"
build = "build.rs"
description = "FFI bindings to FFmpeg (ffmpeg-sys-next 9.1.1 with committed bindings)"
license = "WTFPL"
publish = false

[lib]
name = "ffmpeg_sys_next"
path = "src/lib.rs"
doctest = false

[dependencies]
libc = "0.2"

[features]
default = ["avcodec", "avdevice", "avfilter", "avformat", "swresample", "swscale"]
avcodec = []
avdevice = ["avformat"]
avfilter = []
avformat = ["avcodec"]
avresample = []
postproc = []
swresample = []
swscale = []
static = []
build = ["static"]
non-exhaustive-enums = []
